# Kivi word-level memory -- Docker Compose
#
# We use SQLite (an embedded database, explicitly allowed by the brief),
# so there is no separate database container to run -- one "app" service
# serves both the API and the static frontend. This is a deliberate
# simplification from a Postgres/multi-container layout; see
# ASSIGNMENT_NOTES.md for the reasoning.
#
# NOTE ON TESTING: this compose file was authored carefully but the sandbox
# used to build this project has no Docker daemon available, so it was not
# actually run end-to-end here. The primary, verified review path is the
# direct (no-Docker) instructions in RUN.md. If anything here needs a small
# fix on your machine, it should be limited to path/version tweaks.

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - KIVI_DB_PATH=/app/data/kivi.db

  evaluation:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results
    environment:
      - KIVI_DB_PATH=/app/data/kivi_eval.db
    working_dir: /app
    entrypoint: ["python3", "-m", "evaluation.runner"]
    profiles: ["tools"]
